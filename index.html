<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Eco Island — Smart Island Emergency Management</title>
<meta name="description" content="Real-time environmental monitoring and AI-assisted emergency resource management for island communities." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ocean-950:#071b24; --ocean-900:#0a222d; --ocean-800:#0f2e3b; --ocean-700:#163d4d; --ocean-600:#1b4a5a;
  --teal-400:#4fd1c5; --teal-300:#7fe0d6; --amber-300:#f5cd7e; --amber-400:#f2b84b;
  --coral-500:#e8613c; --coral-400:#f0805f; --sand-100:#ede6d6; --sand-050:#f6f2e8;
  --fog-300:#9fb4ba; --fog-500:#6c8890;
  --font-display:'Space Grotesk','Inter',sans-serif; --font-body:'Inter',system-ui,sans-serif; --font-mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--ocean-950);color:var(--sand-050)}
body{font-family:var(--font-body);-webkit-font-smoothing:antialiased}
#root{min-height:100vh}
.app{min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(ellipse at top,var(--ocean-800) 0%,var(--ocean-950) 55%);padding:20px clamp(16px,4vw,48px) 48px;gap:20px;transition:background 400ms ease}
.app--emergency{background:radial-gradient(ellipse at top,#2a1712 0%,var(--ocean-950) 55%)}
.app-header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--ocean-700);position:relative}
.app-header__brand{display:flex;align-items:center;gap:12px}
.app-header__mark{color:var(--teal-400);flex-shrink:0}
.app-header__title{font-family:var(--font-display);font-size:22px;font-weight:700;margin:0;letter-spacing:-0.01em}
.app-header__tagline{margin:2px 0 0;font-size:13px;color:var(--fog-300);max-width:42ch}
.app-header__controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.app-header__updated{width:100%;margin:0;font-family:var(--font-mono);font-size:11px;color:var(--fog-500);text-align:right}
.island-selector{display:flex;align-items:center;gap:8px;background:var(--ocean-800);border:1px solid var(--ocean-600);border-radius:10px;padding:8px 12px}
.island-selector__label{font-size:12px;color:var(--fog-300)}
.island-selector__select{background:transparent;color:var(--sand-050);border:none;font-family:var(--font-body);font-size:14px;font-weight:600;outline:none;max-width:240px}
.island-selector__select:focus-visible{outline:2px solid var(--teal-400);outline-offset:2px;border-radius:4px}
.island-selector__select option, .island-selector__select optgroup{background:var(--ocean-800);color:var(--sand-050)}
.mode-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid var(--ocean-600);font-size:13px;font-weight:600;color:var(--teal-300)}
.mode-badge__dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.mode-badge--normal{color:var(--teal-300);border-color:#2c5e63}
.mode-badge--watch{color:var(--amber-300);border-color:#6b5a3a}
.mode-badge--warning{color:var(--amber-400);border-color:#6b4a2a}
.mode-badge--emergency{color:var(--coral-400);border-color:#7a3a2a;animation:pulse-badge 2.4s ease-in-out infinite}
@keyframes pulse-badge{0%,100%{box-shadow:0 0 0 0 rgba(232,97,60,.35)}50%{box-shadow:0 0 0 6px rgba(232,97,60,0)}}
.emergency-banner{background:#3a2119;border:1px solid #7a3a2a;color:var(--sand-050);padding:12px 18px;border-radius:10px;font-size:14px;font-weight:500}
.app__grid{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:20px;align-items:start}
@media (max-width:900px){.app__grid{grid-template-columns:1fr}}
.app__column{display:flex;flex-direction:column;gap:20px}
.panel{background:var(--ocean-800);border:1px solid var(--ocean-700);border-radius:16px;padding:20px 22px}
.panel__header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}
.panel__header h2{font-family:var(--font-display);font-size:16px;margin:0;font-weight:600}
.panel__subtitle{font-size:12px;color:var(--fog-300);font-family:var(--font-mono)}
.panel__status{font-size:13px;color:var(--fog-300);margin:0 0 12px}
.panel__status--error{color:var(--amber-300)}
.panel__status--warning{color:var(--amber-400);background:#2c220f;padding:8px 10px;border-radius:8px}
.panel__footnote{margin:14px 0 0;font-size:11px;color:var(--fog-500)}
.status-panel{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.status-ring{position:relative;width:160px;height:160px}
.status-ring__svg{width:100%;height:100%;transform:rotate(-90deg)}
.status-ring__track{fill:none;stroke:var(--ocean-700);stroke-width:10}
.status-ring__value{fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 700ms ease,stroke 400ms ease}
.status-ring__center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.status-ring__score{font-family:var(--font-display);font-size:36px;font-weight:700}
.status-ring__unit{font-size:11px;color:var(--fog-300);text-transform:lowercase}
.status-ring__badge{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:var(--ocean-900);border:1px solid;border-radius:999px;padding:4px 12px;font-size:11px;font-weight:600;white-space:nowrap}
.status-panel__note{font-size:13px;color:var(--fog-300);margin:12px 0 0;max-width:34ch}
.weather-panel__headline{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
.weather-panel__temp{font-family:var(--font-display);font-size:40px;font-weight:700}
.weather-panel__condition{font-size:14px;color:var(--fog-300)}
.weather-panel__grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 16px;margin:0}
.weather-panel__grid dt{font-size:11px;color:var(--fog-500);margin-bottom:2px}
.weather-panel__grid dd{margin:0;font-family:var(--font-mono);font-size:14px;font-weight:600}
.resource-card__stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.resource-card__stat-value{display:block;font-family:var(--font-mono);font-size:17px;font-weight:600;color:var(--teal-300)}
.resource-card__stat-label{display:block;font-size:11px;color:var(--fog-300);margin-top:2px}
.allocation-list{display:flex;flex-direction:column;gap:12px}
.allocation-row__top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.allocation-row__label{font-weight:500}
.allocation-row__status{font-size:11px;font-weight:600;color:var(--fog-300)}
.allocation-row--reduced .allocation-row__status{color:var(--amber-400)}
.allocation-row--off .allocation-row__status,.allocation-row--paused .allocation-row__status{color:var(--coral-400)}
.allocation-row--full .allocation-row__status{color:var(--teal-300)}
.allocation-row__track{height:6px;border-radius:999px;background:var(--ocean-700);overflow:hidden}
.allocation-row__fill{height:100%;border-radius:999px;background:var(--teal-400);transition:width 500ms ease}
.allocation-row--reduced .allocation-row__fill{background:var(--amber-400)}
.allocation-row--off .allocation-row__fill,.allocation-row--paused .allocation-row__fill{background:var(--coral-500)}
.allocation-row__figures{margin-top:4px;font-family:var(--font-mono);font-size:11px;color:var(--fog-500)}
.event-log__list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.event-log__item{display:flex;gap:12px;font-size:13px;padding-bottom:12px;border-bottom:1px solid var(--ocean-700)}
.event-log__item:last-child{border-bottom:none;padding-bottom:0}
.event-log__time{font-family:var(--font-mono);font-size:11px;color:var(--fog-500);flex-shrink:0;padding-top:1px}
.event-log__text{color:var(--sand-100)}
.app__footer{text-align:center}
.app__footer p{margin:0;font-size:11px;color:var(--fog-500);max-width:70ch;margin-inline:auto}
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ============================== DATA ============================== */
const ISLAND_GROUPS = [
  { region: 'Pacific Islands', islands: [
    { id:'fiji', name:'Fiji (Suva)', lat:-18.1416, lon:178.4419 },
    { id:'vanuatu', name:'Vanuatu (Port Vila)', lat:-17.7333, lon:168.3273 },
    { id:'solomon', name:'Solomon Islands (Honiara)', lat:-9.4456, lon:159.9729 },
    { id:'samoa', name:'Samoa (Apia)', lat:-13.8333, lon:-171.7667 },
    { id:'tonga', name:'Tonga (Nuku\u02bbalofa)', lat:-21.1789, lon:-175.1982 },
    { id:'hawaii', name:'Hawai\u02bbi (Honolulu)', lat:21.3069, lon:-157.8583 },
    { id:'kiribati', name:'Kiribati (Tarawa)', lat:1.3291, lon:172.9791 },
  ]},
  { region: 'Indian Ocean Islands', islands: [
    { id:'maldives', name:'Maldives (Mal\u00e9)', lat:4.1755, lon:73.5093 },
    { id:'seychelles', name:'Seychelles (Victoria)', lat:-4.6191, lon:55.4513 },
    { id:'comoros', name:'Comoros (Moroni)', lat:-11.7042, lon:43.2402 },
    { id:'srilanka', name:'Sri Lanka (Colombo)', lat:6.9271, lon:79.8612 },
    { id:'madagascar', name:'Madagascar (Antananarivo)', lat:-18.8792, lon:47.5079 },
  ]},
  { region: 'Caribbean Islands', islands: [
    { id:'bahamas', name:'Bahamas (Nassau)', lat:25.0480, lon:-77.3554 },
    { id:'barbados', name:'Barbados (Bridgetown)', lat:13.1132, lon:-59.5988 },
    { id:'puertorico', name:'Puerto Rico (San Juan)', lat:18.4655, lon:-66.1057 },
    { id:'jamaica', name:'Jamaica (Kingston)', lat:17.9712, lon:-76.7936 },
    { id:'dominica', name:'Dominica (Roseau)', lat:15.3092, lon:-61.3794 },
  ]},
  { region: 'Atlantic Islands', islands: [
    { id:'azores', name:'Azores (Ponta Delgada)', lat:37.7412, lon:-25.6756 },
    { id:'canary', name:'Canary Islands (Las Palmas)', lat:28.1235, lon:-15.4363 },
    { id:'capeverde', name:'Cape Verde (Praia)', lat:14.9330, lon:-23.5133 },
  ]},
];

function findIsland(id){
  for(const g of ISLAND_GROUPS){ const m = g.islands.find(i=>i.id===id); if(m) return m; }
  return null;
}

/* ============================== WEATHER ============================== */
const WMO_CODES = {0:'Clear sky',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Depositing rime fog',
  51:'Light drizzle',53:'Moderate drizzle',55:'Dense drizzle',56:'Light freezing drizzle',57:'Dense freezing drizzle',
  61:'Slight rain',63:'Moderate rain',65:'Heavy rain',66:'Light freezing rain',67:'Heavy freezing rain',
  71:'Slight snow',73:'Moderate snow',75:'Heavy snow',77:'Snow grains',80:'Slight rain showers',81:'Moderate rain showers',
  82:'Violent rain showers',85:'Slight snow showers',86:'Heavy snow showers',95:'Thunderstorm',
  96:'Thunderstorm with slight hail',99:'Thunderstorm with heavy hail'};

function describeWeatherCode(code){ return WMO_CODES[code] || 'Unknown conditions'; }

async function fetchIslandWeather(lat, lon){
  const params = new URLSearchParams({
    latitude: lat, longitude: lon,
    current: ['temperature_2m','relative_humidity_2m','precipitation','weather_code','surface_pressure','wind_speed_10m','wind_gusts_10m'].join(','),
    timezone: 'auto', wind_speed_unit: 'kmh',
  });
  const res = await fetch(`https://api.open-meteo.com/v1/forecast?${params.toString()}`);
  if(!res.ok) throw new Error(`Weather service responded with ${res.status}`);
  const data = await res.json();
  const c = data.current;
  return {
    temperatureC: c.temperature_2m, humidity: c.relative_humidity_2m, precipitationMm: c.precipitation,
    weatherCode: c.weather_code, conditionText: describeWeatherCode(c.weather_code),
    pressureHpa: c.surface_pressure, windSpeedKmh: c.wind_speed_10m, windGustsKmh: c.wind_gusts_10m,
    observedAt: c.time,
  };
}

function classifyConditions(weather){
  if(!weather) return { level:'unknown', reasons:[] };
  const reasons = [];
  let level = 'normal';
  const stormCodes = new Set([95,96,99]);
  const heavyRainCodes = new Set([65,67,82]);

  if(weather.windGustsKmh>=90 || weather.windSpeedKmh>=75 || stormCodes.has(weather.weatherCode)){
    level='emergency';
    reasons.push(stormCodes.has(weather.weatherCode)
      ? `Active thunderstorm detected (${weather.conditionText.toLowerCase()})`
      : `Sustained winds of ${Math.round(weather.windSpeedKmh)} km/h with gusts to ${Math.round(weather.windGustsKmh)} km/h`);
  } else if(weather.windGustsKmh>=60 || weather.windSpeedKmh>=45 || heavyRainCodes.has(weather.weatherCode) || weather.precipitationMm>=15){
    level='warning';
    reasons.push(`Elevated wind and rainfall (${weather.conditionText.toLowerCase()})`);
  } else if(weather.windGustsKmh>=40 || weather.precipitationMm>=5){
    level='watch';
    reasons.push('Conditions building — monitoring closely');
  } else {
    reasons.push('Conditions within normal range');
  }

  if(weather.pressureHpa && weather.pressureHpa<990 && level!=='emergency'){
    level = level==='normal' ? 'watch' : level;
    reasons.push(`Low barometric pressure (${Math.round(weather.pressureHpa)} hPa)`);
  }
  return { level, reasons };
}

/* ============================== SIMULATED TELEMETRY ============================== */
// No live microgrid hooked up for this demo: battery/generation/water are
// simulated, but driven by the real weather above (not random noise).
function hashString(str){ let h=0; for(let i=0;i<str.length;i++){ h=(Math.imul(31,h)+str.charCodeAt(i))|0; } return h>>>0; }
function mulberry32(seed){ let a=seed; return function(){ a|=0; a=(a+0x6d2b79f5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }

function simulateTelemetry(islandId, weather, level){
  const tenMinuteBucket = Math.floor(Date.now()/(10*60*1000));
  const rand = mulberry32(hashString(`${islandId}-${tenMinuteBucket}`));
  const windKmh = weather ? weather.windSpeedKmh : 10;
  const cloudPenalty = weather ? Math.min(weather.precipitationMm/20,1) : 0.2;

  const solarKw = Math.max(15, 120*(1-cloudPenalty*0.8)) * (0.85+rand()*0.3);
  const windGenKw = windKmh>70 ? 10 : Math.min(90, windKmh*1.1) * (0.85+rand()*0.3);
  const generationKw = Math.round(solarKw+windGenKw);

  const baseDemandKw = 140;
  const stressMultiplier = {normal:1,watch:1.08,warning:1.2,emergency:1.35}[level] || 1;
  const demandKw = Math.round(baseDemandKw*stressMultiplier*(0.9+rand()*0.2));

  const batteryCapacityKwh = 900;
  const batteryDrainFactor = {normal:0,watch:0.02,warning:0.05,emergency:0.09}[level] || 0;
  const batteryPct = Math.max(6, Math.min(98, Math.round((0.55+rand()*0.35-batteryDrainFactor)*100)));
  const batteryKwh = Math.round((batteryPct/100)*batteryCapacityKwh);

  const waterReserveCapacityM3 = 4000;
  const waterDrainFactor = {normal:0,watch:0.03,warning:0.08,emergency:0.15}[level] || 0;
  const waterPct = Math.max(8, Math.min(97, Math.round((0.6+rand()*0.3-waterDrainFactor)*100)));
  const waterReserveM3 = Math.round((waterPct/100)*waterReserveCapacityM3);
  const waterConsumptionM3ph = Math.round((18+rand()*6)*stressMultiplier);

  return { generationKw, solarKw:Math.round(solarKw), windGenKw:Math.round(windGenKw), demandKw,
    batteryPct, batteryKwh, batteryCapacityKwh, waterPct, waterReserveM3, waterReserveCapacityM3, waterConsumptionM3ph };
}

/* ============================== EMERGENCY ALLOCATION ENGINE ============================== */
const POWER_SERVICES = [
  { id:'hospital', label:'Hospital & clinic', demandKw:35, emergencyDemandKw:35 },
  { id:'water-pumping', label:'Water pumping & treatment', demandKw:28, emergencyDemandKw:28 },
  { id:'comms', label:'Emergency communications', demandKw:8, emergencyDemandKw:8 },
  { id:'shelters', label:'Community shelters', demandKw:22, emergencyDemandKw:18 },
  { id:'refrigeration', label:'Food & medical refrigeration', demandKw:18, emergencyDemandKw:14 },
  { id:'residential', label:'Residential power', demandKw:55, emergencyDemandKw:20 },
  { id:'street-lighting', label:'Street lighting', demandKw:10, emergencyDemandKw:4 },
  { id:'commercial', label:'Commercial & retail', demandKw:30, emergencyDemandKw:0 },
  { id:'public-wifi', label:'Public Wi-Fi', demandKw:4, emergencyDemandKw:0 },
];
const WATER_SERVICES = [
  { id:'hospital-water', label:'Hospital & clinic', demandM3ph:3, emergencyDemandM3ph:3 },
  { id:'drinking-water', label:'Drinking water distribution', demandM3ph:9, emergencyDemandM3ph:9 },
  { id:'shelters-water', label:'Community shelters', demandM3ph:4, emergencyDemandM3ph:4 },
  { id:'sanitation', label:'Sanitation systems', demandM3ph:5, emergencyDemandM3ph:4 },
  { id:'residential-water', label:'Residential supply', demandM3ph:12, emergencyDemandM3ph:5 },
  { id:'irrigation', label:'Agricultural irrigation', demandM3ph:8, emergencyDemandM3ph:0 },
  { id:'commercial-water', label:'Commercial use', demandM3ph:6, emergencyDemandM3ph:0 },
];

function allocate(services, supply, level, normalKey, emergencyKey){
  const inEmergency = level==='warning' || level==='emergency';
  let remaining = supply;
  return services.map(service=>{
    const wanted = inEmergency ? service[emergencyKey] : service[normalKey];
    const given = Math.max(0, Math.min(wanted, remaining));
    remaining -= given;
    let status = 'full';
    if(wanted===0) status='paused';
    else if(given<=0) status='off';
    else if(given<wanted) status='reduced';
    return { ...service, wanted, given, status };
  });
}
const allocatePower = (kw, level) => allocate(POWER_SERVICES, kw, level, 'demandKw', 'emergencyDemandKw');
const allocateWater = (m3, level) => allocate(WATER_SERVICES, m3, level, 'demandM3ph', 'emergencyDemandM3ph');

function buildEventLog({ level, reasons, telemetry, powerAllocation, waterAllocation }){
  const log = [];
  const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  if(level==='normal'){
    log.push({ time, text:'Conditions normal. Resources distributed on standard schedule.' });
    return log;
  }
  reasons.forEach(r=>log.push({ time, text:r }));

  if(telemetry.windGenKw<40 && telemetry.generationKw<telemetry.demandKw){
    log.push({ time, text:`Generation (${telemetry.generationKw} kW) is short of demand (${telemetry.demandKw} kW) — drawing down battery reserve.` });
  }
  const shedPower = powerAllocation.filter(s=>s.status==='off'||s.status==='paused');
  if(shedPower.length) log.push({ time, text:`Non-essential loads shed to protect critical services: ${shedPower.map(s=>s.label.toLowerCase()).join(', ')}.` });
  const reducedPower = powerAllocation.filter(s=>s.status==='reduced');
  if(reducedPower.length) log.push({ time, text:`Power reduced (not cut) to: ${reducedPower.map(s=>s.label.toLowerCase()).join(', ')}.` });
  const shedWater = waterAllocation.filter(s=>s.status==='off'||s.status==='paused');
  if(shedWater.length) log.push({ time, text:`Water rerouted away from lower-priority use (${shedWater.map(s=>s.label.toLowerCase()).join(', ')}) to protect drinking water and the hospital supply.` });
  if(level==='emergency'){
    log.push({ time, text:'Cross-system check: hospital and water pumping confirmed on guaranteed power. Battery reserve prioritized for critical services if generation keeps falling.' });
  }
  return log;
}

/* ============================== RENDERING ============================== */
const MODE_COPY = { normal:'Normal', watch:'Watch', warning:'Warning', emergency:'Emergency mode', unknown:'Connecting' };
const LEVEL_COLOR = { normal:'var(--teal-400)', watch:'var(--amber-300)', warning:'var(--amber-400)', emergency:'var(--coral-500)', unknown:'var(--fog-300)' };
const STATUS_LABEL = { full:'Full power', reduced:'Reduced', off:'Shed', paused:'Paused' };

const DEFAULT_ISLAND_ID = ISLAND_GROUPS[0].islands[0].id;
const WEATHER_POLL_MS = 5*60*1000;
const TICK_MS = 30*1000;

const state = { islandId: DEFAULT_ISLAND_ID, weather: null, loading: true, error: null, lastUpdated: null };

function el(tag, attrs={}, children=[]){
  const node = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k==='class') node.className = v;
    else if(k==='html') node.innerHTML = v;
    else if(k.startsWith('on') && typeof v==='function') node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c==null) return;
    node.appendChild(typeof c==='string' ? document.createTextNode(c) : c);
  });
  return node;
}

function allocationRow(service, unit){
  const pct = service.wanted>0 ? Math.round((service.given/service.wanted)*100) : 0;
  return el('div', { class:`allocation-row allocation-row--${service.status}` }, [
    el('div', { class:'allocation-row__top' }, [
      el('span', { class:'allocation-row__label' }, service.label),
      el('span', { class:'allocation-row__status' }, STATUS_LABEL[service.status]),
    ]),
    el('div', { class:'allocation-row__track' }, [
      el('div', { class:'allocation-row__fill', style:`width:${pct}%` }),
    ]),
    el('div', { class:'allocation-row__figures' }, `${service.given} / ${service.wanted} ${unit}`),
  ]);
}

function renderStatusRing(level, score){
  const color = LEVEL_COLOR[level] || LEVEL_COLOR.unknown;
  const radius = 64, circumference = 2*Math.PI*radius, offset = circumference - (score/100)*circumference;
  const wrap = el('div', { class:'status-ring' });
  wrap.innerHTML = `
    <svg viewBox="0 0 160 160" class="status-ring__svg" role="img" aria-label="Island resilience score ${score} percent, ${MODE_COPY[level]||'unknown'}">
      <circle cx="80" cy="80" r="${radius}" class="status-ring__track" />
      <circle cx="80" cy="80" r="${radius}" style="stroke:${color};stroke-dasharray:${circumference};stroke-dashoffset:${offset}" class="status-ring__value" />
    </svg>
    <div class="status-ring__center">
      <span class="status-ring__score">${score}</span>
      <span class="status-ring__unit">resilience</span>
    </div>
    <div class="status-ring__badge" style="color:${color};border-color:${color}">${MODE_COPY[level]||'Connecting…'}</div>
  `;
  return wrap;
}

function render(){
  const island = findIsland(state.islandId);
  const { level, reasons } = classifyConditions(state.weather);
  const telemetry = simulateTelemetry(state.islandId, state.weather, level);
  const powerAllocation = allocatePower(telemetry.generationKw + Math.round(telemetry.batteryKwh*0.2), level);
  const waterAllocation = allocateWater(Math.round(telemetry.waterReserveM3/24), level);
  const eventLog = buildEventLog({ level, reasons, telemetry, powerAllocation, waterAllocation });
  const generationRatio = Math.min(1, telemetry.generationKw/telemetry.demandKw);
  const resilienceScore = Math.round(telemetry.batteryPct*0.4 + telemetry.waterPct*0.35 + generationRatio*100*0.25);

  const root = document.getElementById('root');
  root.innerHTML = '';

  const app = el('div', { class:`app app--${level}` });

  // Header
  const select = el('select', { class:'island-selector__select', 'aria-label':'Select island or island group' });
  ISLAND_GROUPS.forEach(group=>{
    const optgroup = el('optgroup', { label: group.region });
    group.islands.forEach(i=>{
      const opt = el('option', { value:i.id }, i.name);
      if(i.id===state.islandId) opt.setAttribute('selected','selected');
      optgroup.appendChild(opt);
    });
    select.appendChild(optgroup);
  });
  select.addEventListener('change', (e)=>{ state.islandId = e.target.value; loadWeather(); });

  const header = el('header', { class:'app-header' }, [
    el('div', { class:'app-header__brand' }, [
      el('span', { class:'app-header__mark', 'aria-hidden':'true', html:`<svg viewBox="0 0 40 40" width="28" height="28"><path d="M20 3 C11 10 6 18 6 25 a14 14 0 0 0 28 0 C34 18 29 10 20 3 Z" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M13 24 c3 3 5 -3 8 0 s5 -3 8 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>` }),
      el('div', {}, [
        el('p', { class:'app-header__title' }, 'Eco Island'),
        el('p', { class:'app-header__tagline' }, 'Smart-island monitoring & emergency resource management'),
      ]),
    ]),
    el('div', { class:'app-header__controls' }, [
      el('label', { class:'island-selector' }, [ el('span', { class:'island-selector__label' }, 'Monitoring'), select ]),
      el('div', { class:`mode-badge mode-badge--${level}` }, [ el('span', { class:'mode-badge__dot' }), MODE_COPY[level]||'Connecting' ]),
    ]),
    state.lastUpdated ? el('p', { class:'app-header__updated' }, `Updated ${state.lastUpdated}`) : null,
  ]);
  app.appendChild(header);

  if(level==='emergency'){
    app.appendChild(el('div', { class:'emergency-banner', role:'alert' }, `Emergency mode active for ${island.name} — essential services are being prioritized automatically.`));
  }

  // Left column: status ring + weather
  const statusPanel = el('section', { class:'panel status-panel', 'aria-label':'Overall resilience' }, [
    renderStatusRing(level, resilienceScore),
    el('p', { class:'status-panel__note' }, {
      normal: 'All systems operating on standard schedules. No automated interventions active.',
      watch: 'Conditions are building. Eco Island is monitoring closely and pre-staging reserves.',
      warning: 'Non-essential loads are being reduced to protect critical services and preserve reserves.',
      emergency: 'Emergency mode: essential services guaranteed, remaining resources distributed by priority.',
      unknown: 'Connecting to live conditions…',
    }[level]),
  ]);

  const weatherPanel = el('section', { class:'panel weather-panel', 'aria-label':'Live weather conditions' }, [
    el('header', { class:'panel__header' }, [ el('h2', {}, 'Live conditions'), el('span', { class:'panel__subtitle' }, island.name) ]),
  ]);
  if(state.loading) weatherPanel.appendChild(el('p', { class:'panel__status' }, 'Fetching current weather…'));
  if(state.error && !state.loading) weatherPanel.appendChild(el('p', { class:'panel__status panel__status--error' }, `Couldn't reach the weather service (${state.error}). Retrying shortly.`));
  if(state.weather && !state.loading){
    const w = state.weather;
    weatherPanel.appendChild(el('div', { class:'weather-panel__headline' }, [
      el('span', { class:'weather-panel__temp' }, `${Math.round(w.temperatureC)}°C`),
      el('span', { class:'weather-panel__condition' }, w.conditionText),
    ]));
    const grid = el('dl', { class:'weather-panel__grid' });
    [['Wind', `${Math.round(w.windSpeedKmh)} km/h`], ['Gusts', `${Math.round(w.windGustsKmh)} km/h`],
     ['Precipitation', `${w.precipitationMm} mm`], ['Humidity', `${w.humidity}%`],
     ['Pressure', `${Math.round(w.pressureHpa)} hPa`],
     ['Observed', new Date(w.observedAt).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})]]
      .forEach(([k,v])=> grid.appendChild(el('div', {}, [ el('dt', {}, k), el('dd', {}, v) ])));
    weatherPanel.appendChild(grid);
    weatherPanel.appendChild(el('p', { class:'panel__footnote' }, 'Source: Open-Meteo, live forecast API.'));
  }

  // Right column: energy, water, event log
  const totalWanted = powerAllocation.reduce((s,a)=>s+a.wanted,0);
  const totalGiven = powerAllocation.reduce((s,a)=>s+a.given,0);
  const shortfall = totalWanted - totalGiven;

  const energyCard = el('section', { class:'panel resource-card', 'aria-label':'Energy status' }, [
    el('header', { class:'panel__header' }, [ el('h2', {}, 'Energy'), el('span', { class:'panel__subtitle' }, `${telemetry.generationKw} kW generated now`) ]),
    el('div', { class:'resource-card__stats' }, [
      el('div', {}, [ el('span', { class:'resource-card__stat-value' }, `${telemetry.solarKw} kW`), el('span', { class:'resource-card__stat-label' }, 'Solar') ]),
      el('div', {}, [ el('span', { class:'resource-card__stat-value' }, `${telemetry.windGenKw} kW`), el('span', { class:'resource-card__stat-label' }, 'Wind') ]),
      el('div', {}, [ el('span', { class:'resource-card__stat-value' }, `${telemetry.batteryPct}%`), el('span', { class:'resource-card__stat-label' }, `Battery (${telemetry.batteryKwh} kWh)`) ]),
    ]),
    shortfall>0 ? el('p', { class:'panel__status panel__status--warning' }, `Demand exceeds generation by ${shortfall} kW — covering the gap from battery reserve and reprioritizing.`) : null,
    el('div', { class:'allocation-list' }, powerAllocation.map(s=>allocationRow(s,'kW'))),
  ]);

  const waterCard = el('section', { class:'panel resource-card', 'aria-label':'Water status' }, [
    el('header', { class:'panel__header' }, [ el('h2', {}, 'Water'), el('span', { class:'panel__subtitle' }, `${telemetry.waterPct}% reserve · ${telemetry.waterReserveM3} m³`) ]),
    el('div', { class:'resource-card__stats' }, [
      el('div', {}, [ el('span', { class:'resource-card__stat-value' }, `${telemetry.waterReserveM3} m³`), el('span', { class:'resource-card__stat-label' }, 'In reserve') ]),
      el('div', {}, [ el('span', { class:'resource-card__stat-value' }, `${telemetry.waterConsumptionM3ph} m³/h`), el('span', { class:'resource-card__stat-label' }, 'Current draw') ]),
      el('div', {}, [ el('span', { class:'resource-card__stat-value' }, `${Math.max(1, Math.round(telemetry.waterReserveM3/telemetry.waterConsumptionM3ph))} h`), el('span', { class:'resource-card__stat-label' }, 'Reserve at this rate') ]),
    ]),
    el('div', { class:'allocation-list' }, waterAllocation.map(s=>allocationRow(s,'m³/h'))),
  ]);

  const logPanel = el('section', { class:'panel event-log', 'aria-label':'Decision log' }, [
    el('header', { class:'panel__header' }, [ el('h2', {}, 'Decision log'), el('span', { class:'panel__subtitle' }, level==='normal' ? 'Standard schedule' : 'Automated response reasoning') ]),
    el('ol', { class:'event-log__list' }, eventLog.map(entry=> el('li', { class:'event-log__item' }, [ el('span', { class:'event-log__time' }, entry.time), el('span', { class:'event-log__text' }, entry.text) ]))),
  ]);

  app.appendChild(el('main', { class:'app__grid' }, [
    el('div', { class:'app__column app__column--left' }, [ statusPanel, weatherPanel ]),
    el('div', { class:'app__column app__column--right' }, [ energyCard, waterCard, logPanel ]),
  ]));

  app.appendChild(el('footer', { class:'app__footer' }, [
    el('p', {}, 'Weather from Open-Meteo, refreshed automatically. Energy, water, and battery figures are simulated telemetry driven by live conditions, standing in for on-island IoT sensors and the microgrid controller.'),
  ]));

  root.appendChild(app);
}

async function loadWeather(){
  state.loading = true; state.error = null;
  render();
  const island = findIsland(state.islandId);
  try{
    state.weather = await fetchIslandWeather(island.lat, island.lon);
    state.lastUpdated = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }catch(err){
    state.error = err.message;
  }finally{
    state.loading = false;
    render();
  }
}

loadWeather();
setInterval(loadWeather, WEATHER_POLL_MS);
setInterval(render, TICK_MS);
</script>
</body>
</html>
